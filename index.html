<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parasite Depths — Deep Sea Endless Runner</title>
    <meta name="description"
        content="Survive the deep ocean as a bioluminescent parasite. Possess fish, eat sharks, and dominate the abyss in this endless runner game.">
    <link rel="stylesheet" href="styles/main.css">
</head>

<body>
    <div id="game-container">
        <div id="loading-screen">
            <h1>PARASITE DEPTHS</h1>
            <div class="loading-bar-container">
                <div class="loading-bar-fill" id="load-bar"></div>
            </div>
            <p>Descending into the depths...</p>
        </div>
    </div>

    <!-- Phaser 3 -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.86.0/dist/phaser.min.js"></script>

    <!-- Config & Utilities -->
    <script src="src/config.js"></script>
    <script src="src/audio.js"></script>
    <script src="src/sprites.js"></script>

    <!-- Entities -->
    <script src="src/entities/Parasite.js"></script>
    <script src="src/entities/Shark.js"></script>
    <script src="src/entities/Host.js"></script>
    <script src="src/entities/Item.js"></script>

    <!-- Systems -->
    <script src="src/systems/ScoreSystem.js"></script>
    <script src="src/systems/SpawnSystem.js"></script>
    <script src="src/systems/HostSystem.js"></script>
    <script src="src/systems/CollisionSystem.js"></script>
    <script src="src/systems/BiomeSystem.js"></script>

    <!-- Scenes -->
    <script src="src/scenes/BootScene.js"></script>
    <script src="src/scenes/MenuScene.js"></script>
    <script src="src/scenes/GameScene.js"></script>
    <script src="src/scenes/HUDScene.js"></script>
    <script src="src/scenes/GameOverScene.js"></script>
    <script src="src/scenes/ShopScene.js"></script>

    <!-- Main Entry -->
    <script src="src/main.js"></script>
</body>

</html>
